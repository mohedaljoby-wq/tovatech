<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | NovaTech</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card register-card"><a class="brand justify-content-center mb-4" href="index.html"><span class="brand-icon"><i class="fa-solid fa-bolt"></i></span>NovaTech</a><div class="text-center mb-4"><span class="eyebrow">GET STARTED</span><h1>Create your <span>account.</span></h1><p>Join the NovaTech digital experience.</p></div><form id="registerForm" novalidate><div class="mb-3"><label for="registerName">Full name</label><input id="registerName" name="fullName" class="form-control" type="text" required minlength="2" pattern="[A-Za-zÀ-ÿ ]{2,}" autocomplete="name"><div class="invalid-feedback">Enter your full name using letters and spaces.</div></div><div class="mb-3"><label for="registerEmail">Email address</label><input id="registerEmail" name="email" class="form-control" type="email" required autocomplete="email"><div class="invalid-feedback">Enter a valid email address.</div></div><div class="mb-3"><label for="registerPassword">Password</label><input id="registerPassword" name="password" class="form-control" type="password" required minlength="6" pattern=".{6,}" autocomplete="new-password"><div class="invalid-feedback">Password must be at least 6 characters.</div></div><div class="mb-3"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" class="form-control" type="password" required minlength="6" autocomplete="new-password"><div class="invalid-feedback">Passwords must match.</div></div><div class="form-check mb-4"><input id="terms" name="terms" class="form-check-input" type="checkbox" required><label class="form-check-label" for="terms">I agree to the NovaTech terms and privacy policy.</label><div class="invalid-feedback">You must accept the terms.</div></div><button class="btn btn-gradient w-100 btn-lg" type="submit">Create Account</button></form><p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p><a class="back-home" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to home</a></section></main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/toastify-js"></script><script src="js/main.js"></script><script src="js/validation.js"></script></body></html>
